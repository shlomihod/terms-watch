# Services with tracking or content issues
# - condition: "availability" - Only mark as minor when page availability issues detected
# - condition: "all" - Mark all changes as minor (service has unstable/dynamic content)
problematic_services:
  - name: "Llama API"
    condition: "availability"

# Exact-block "flip-flop" scraping artifacts: a trailing block the scraper intermittently
# captures/drops. Matched by EXACT net-change (multiset) equality on non-blank body lines,
# scoped by service (+ optional documentType); classified "Unstable content (tracking error)."
# EXACT-MATCH RULES: every marker/block string is case-sensitive and byte-exact. Always
# double-quote. Never use a block scalar (| adds \n, >- folds wraps) — both break matching.
content_artifacts:
  - name: qwen-cookie-consent
    services: ["Qwen Chat"]
    documentType: "Trackers Policy"
    marker: "We'd like to use cookies to remember your preferences"
    block:
      - "Cookie Notice"
      - "We'd like to use cookies to remember your preferences and show relevant content. You can accept all cookies for a fully personalized experience, or select only the strictly necessary ones to keep Qwen Studio running securely. For more details, please read our [Cookie Notice](https://qwen.ai/cookies-notice)."
      - "Accept all cookiesAccept all strictly necessary cookies"
  - name: other-ways-to-get-help
    services: ["Instagram", "Threads"]
    marker: "Other ways to get help"
    block:
      - "Other ways to get help"
      - "----------------------"   # 22-dash markdown setext underline (heading length)
  - name: tiktok-uk-ads-privacy-notice   # single notice line toggled in/out since 2026-05-30
    services: ["TikTok"]
    documentType: "Privacy Policy"
    marker: "We are changing how we show ads to UK users"
    block:
      - "_We are changing how we show ads to UK users. Our new [Privacy Policy for UK users](https://www.tiktok.com/legal/page/global/privacy-policy-eea-new/en) comes into effect on 11 November 2026 or, if you are in the UK, when you make a choice about ads._"
